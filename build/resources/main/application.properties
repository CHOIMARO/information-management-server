spring.application.name=information-management

# H2 파일 모드: 서버를 재시작해도 ./data/memodb 파일에 데이터가 유지된다.
# AUTO_SERVER=TRUE: 여러 프로세스(IntelliJ 서버 + 검증용 서버)가 같은 DB 파일을 공유할 수 있게 한다.
spring.datasource.url=jdbc:h2:file:./data/memodb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# 엔티티 기준으로 테이블을 자동 생성/보완한다. 학습·개발용 설정 (운영에서는 마이그레이션 도구 사용)
spring.jpa.hibernate.ddl-auto=update

# JPA가 실행하는 실제 SQL을 로그로 확인
spring.jpa.show-sql=true

# 브라우저에서 DB를 직접 들여다보는 콘솔: http://localhost:8080/h2-console
spring.h2.console.enabled=true
