# 테스트 전용 설정.
# 테스트 클래스패스에 같은 이름의 파일이 있으면 main의 application.properties보다 먼저 발견되어 이 파일이 사용된다.
# 파일 DB(./data/memodb)가 아니라 인메모리 H2를 사용해서, 테스트가 개발용 데이터를 건드리지 않게 격리한다.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# 테스트도 운영과 같은 경로로 스키마를 만든다: Flyway 마이그레이션 적용 + Hibernate는 검증만.
# (이전의 create-drop은 Flyway와 서로 스키마를 건드리며 충돌하므로 함께 쓰지 않는다)
spring.jpa.hibernate.ddl-auto=validate

# 주의: 이 파일은 main의 application.properties를 '대체'하므로,
# main에 추가된 필수 속성은 여기에도 있어야 한다.
jwt.secret=test-only-secret-key-must-be-at-least-32-bytes!!
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=604800000
