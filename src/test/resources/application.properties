# 테스트 전용 설정: 테스트 클래스패스가 우선되므로 main의 application.properties를 대체한다.
# 실제 DB 파일(./data/memodb)을 건드리지 않도록 순수 인메모리 DB를 사용한다.
spring.application.name=information-management
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
