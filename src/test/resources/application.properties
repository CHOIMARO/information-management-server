# 테스트 전용 설정.
# 테스트 클래스패스에 같은 이름의 파일이 있으면 main의 application.properties보다 먼저 발견되어 이 파일이 사용된다.
#
# jdbc:tc: URL은 Testcontainers의 특수 드라이버가 해석한다:
# 테스트 시작 시 postgres:17 컨테이너를 자동으로 띄우고 연결해 준다 (Docker 필요).
# 같은 URL을 쓰는 테스트들은 JVM 안에서 컨테이너 하나를 공유하고, 테스트가 끝나면 사라진다.
# 운영과 같은 DB로 테스트하므로 방언 차이로 인한 "테스트는 통과하는데 운영에서 깨짐"이 없다.
spring.datasource.url=jdbc:tc:postgresql:17:///memodb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# 스키마는 Flyway 마이그레이션이 만들고 Hibernate는 검증만 한다 (main과 동일한 경로)
spring.jpa.hibernate.ddl-auto=validate

# 주의: 이 파일은 main의 application.properties를 '대체'하므로,
# main에 추가된 필수 속성은 여기에도 있어야 한다.
jwt.secret=test-only-secret-key-must-be-at-least-32-bytes!!
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=604800000
