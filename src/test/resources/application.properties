# 테스트 전용 설정.
# 테스트 클래스패스에 같은 이름의 파일이 있으면 main의 application.properties보다 먼저 발견되어 이 파일이 사용된다.
#
# jdbc:tc: URL은 Testcontainers의 특수 드라이버가 해석한다:
# 테스트 시작 시 postgres:17 컨테이너를 자동으로 띄우고 연결해 준다 (Docker 필요).
# 같은 URL을 쓰는 테스트들은 JVM 안에서 컨테이너 하나를 공유하고, 테스트가 끝나면 사라진다.
# 운영과 같은 DB로 테스트하므로 방언 차이로 인한 "테스트는 통과하는데 운영에서 깨짐"이 없다.
spring.datasource.url=jdbc:tc:postgresql:17:///memodb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# 스키마는 Flyway 마이그레이션이 만들고 Hibernate는 검증만 한다 (main과 동일한 경로)
spring.jpa.hibernate.ddl-auto=validate

# 주의: 이 파일은 main의 application.properties를 '대체'하므로,
# main에 추가된 필수 속성은 여기에도 있어야 한다.
jwt.secret=test-only-secret-key-must-be-at-least-32-bytes!!
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

# 더빙: 테스트는 TtsClient·AudioStorage를 @MockitoBean으로 바꾸므로 실제 키와 버킷은 쓰지 않는다.
# 다만 다른 테스트 컨텍스트에서는 실제 Bean이 만들어지므로 필수 속성 값은 있어야 한다.
typecast.base-url=https://api.typecast.test
typecast.api-key=test-dummy-key
typecast.model=ssfm-v31
aws.region=ap-northeast-2
aws.s3.bucket=test-bucket
# Worker 자동 실행을 막는다 (1시간 뒤 첫 실행 = 테스트 중에는 실행되지 않음).
# 테스트는 DubbingJobWorker.processNext()를 직접 호출해 처리 시점을 통제한다.
dubbing.worker.initial-delay-ms=3600000
withdrawal.worker.initial-delay-ms=3600000
security.token-encryption-key=dGVzdC1vbmx5LXRva2VuLWVuY3J5cHRpb24ta2V5ISE=
# API 문서: main과 같은 설정 (OpenApiDocsTest가 검증한다)
springdoc.paths-to-exclude=/memos/**,/tags/**
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false
