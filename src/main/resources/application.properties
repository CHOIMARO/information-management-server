spring.application.name=information-management

# 로컬 개발용 PostgreSQL. 프로젝트 루트에서 docker compose up -d db 로 먼저 띄운다.
# 컨테이너(compose)로 앱을 실행할 때는 SPRING_DATASOURCE_URL 환경변수가 이 값을 덮어쓴다.
spring.datasource.url=jdbc:postgresql://localhost:5432/memodb
spring.datasource.username=memo
spring.datasource.password=memo1234

# 스키마 관리는 Flyway가 담당한다 (src/main/resources/db/migration의 V1, V2... 파일).
# Hibernate는 엔티티와 DB가 일치하는지 '검증만' 한다 — 어긋나면 서버가 뜨지 않아 실수를 조기에 잡는다.
spring.jpa.hibernate.ddl-auto=validate

# (과거 H2 개발 DB용 baseline 설정은 PostgreSQL 전환으로 제거됨 —
#  새 DB는 빈 상태에서 V1부터 전부 적용된다)

# JPA가 실행하는 실제 SQL을 로그로 확인
spring.jpa.show-sql=true

# N+1 완화: 지연 로딩을 엔티티별 쿼리 1번씩이 아니라 IN 절로 최대 100개씩 묶어서 조회한다.
# (페이징과 fetch join은 함께 못 쓰므로, 컬렉션 로딩은 배치 사이즈 방식이 안전하다)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ?size= 로 요청할 수 있는 페이지 크기 상한 (한 번의 요청이 DB를 통째로 읽어가는 것 방지)
spring.data.web.pageable.max-page-size=100

# JWT 서명 비밀키(HS256, 32바이트 이상 필수).
# 개발용 값이다. 운영 배포 시에는 반드시 환경변수로 주입하고 저장소에 두지 않는다.
jwt.secret=dev-only-secret-key-must-be-at-least-32-bytes-long!!
# access 토큰 1시간: 만료되면 refresh 토큰으로 재발급받는다.
jwt.access-expiration-ms=3600000
# refresh 토큰 30일: 이 기간이 지나면 재로그인 필요 (= 자동 로그아웃 주기)
jwt.refresh-expiration-ms=2592000000
