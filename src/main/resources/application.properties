spring.application.name=information-management

# 로컬 개발용 PostgreSQL. 프로젝트 루트에서 docker compose up -d db 로 먼저 띄운다.
# 컨테이너(compose)로 앱을 실행할 때는 SPRING_DATASOURCE_URL 환경변수가 이 값을 덮어쓴다.
spring.datasource.url=jdbc:postgresql://localhost:5432/memodb
spring.datasource.username=memo
spring.datasource.password=memo1234

# 스키마 관리는 Flyway가 담당한다 (src/main/resources/db/migration의 V1, V2... 파일).
# Hibernate는 엔티티와 DB가 일치하는지 '검증만' 한다 — 어긋나면 서버가 뜨지 않아 실수를 조기에 잡는다.
spring.jpa.hibernate.ddl-auto=validate

# (과거 H2 개발 DB용 baseline 설정은 PostgreSQL 전환으로 제거됨 —
#  새 DB는 빈 상태에서 V1부터 전부 적용된다)

# JPA가 실행하는 실제 SQL을 로그로 확인
spring.jpa.show-sql=true

# N+1 완화: 지연 로딩을 엔티티별 쿼리 1번씩이 아니라 IN 절로 최대 100개씩 묶어서 조회한다.
# (페이징과 fetch join은 함께 못 쓰므로, 컬렉션 로딩은 배치 사이즈 방식이 안전하다)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ?size= 로 요청할 수 있는 페이지 크기 상한 (한 번의 요청이 DB를 통째로 읽어가는 것 방지)
spring.data.web.pageable.max-page-size=100

# JWT 서명 비밀키(HS256, 32바이트 이상 필수).
# 개발용 값이다. 운영 배포 시에는 반드시 환경변수로 주입하고 저장소에 두지 않는다.
jwt.secret=dev-only-secret-key-must-be-at-least-32-bytes-long!!
# access 토큰 1시간: 만료되면 refresh 토큰으로 재발급받는다.
jwt.access-expiration-ms=3600000
# refresh 토큰 30일: 이 기간이 지나면 재로그인 필요 (= 자동 로그아웃 주기)
jwt.refresh-expiration-ms=2592000000

# ===== SNS 로그인 =====
# 값은 모두 환경변수로 주입한다. 비어 있으면 그 SNS의 로그인은 모두 거절된다 (안전한 쪽으로 실패).
# 카카오: 앱 ID(숫자). 토큰이 우리 앱에서 발급됐는지 확인한다. 앱 키가 아니다.
kakao.app-id=${KAKAO_APP_ID:}
# 카카오: 어드민 키. 탈퇴할 때 연결 끊기에만 쓴다. 모든 사용자를 다룰 수 있는 키라서 서버에만 둔다.
kakao.admin-key=${KAKAO_ADMIN_KEY:}
# 구글: idToken의 aud로 허용할 클라이언트 ID 목록(쉼표 구분). Android·iOS 앱이 serverClientId로 넘기는 Web 클라이언트 ID다.
google.client-ids=${GOOGLE_CLIENT_IDS:}
# Apple: identityToken의 aud로 허용할 값 목록(쉼표 구분). iOS 앱은 번들 ID다.
apple.client-ids=${APPLE_CLIENT_IDS:}
# Apple: 탈퇴할 때 Apple 토큰을 취소하는 데 쓴다. Apple 개발자 계정의 Team ID, .p8 키의 Key ID와 파일 내용.
# APPLE_PRIVATE_KEY는 한 줄로 넣는다: 줄바꿈을 \n으로 적거나, BEGIN/END 줄을 빼고 Base64 본문만 넣는다.
apple.team-id=${APPLE_TEAM_ID:}
apple.key-id=${APPLE_KEY_ID:}
apple.private-key=${APPLE_PRIVATE_KEY:}

# DB에 저장하는 비밀 값(Apple refresh 토큰)의 암호화 키. 32바이트 난수를 Base64로 넣는다: openssl rand -base64 32
# 비어 있으면 Apple 토큰을 저장하지 않는다. 바꾸면 이미 저장한 토큰을 읽을 수 없다.
security.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}

# ===== 회원 탈퇴 후처리 (카카오 연결 끊기, Apple 토큰 취소, 더빙 데이터 삭제) =====
# Worker가 5초마다 처리할 작업을 확인한다
withdrawal.worker.fixed-delay-ms=5000
# 실패하면 1, 2, 4, 8 ... 분 간격으로 이 횟수까지 시도한다 (최대 간격 6시간)
withdrawal.worker.max-attempts=10
# PROCESSING 상태로 이 시간(분)이 지난 작업은 서버가 처리 중에 멈춘 것으로 보고 다시 가져온다
withdrawal.worker.stale-after-minutes=10

# ===== 더빙 (Typecast TTS + S3) =====
# 키와 버킷 이름은 환경변수로만 주입한다. 저장소에 실제 값을 두지 않는다.
# 값이 비어 있어도 서버는 뜬다 (메모 기능 개발에는 필요 없음). 더빙을 시험할 때만 설정한다.
typecast.base-url=https://api.typecast.ai
typecast.api-key=${TYPECAST_API_KEY:}
# 합성·복제에 쓰는 Typecast 모델 (문서 권장값)
typecast.model=ssfm-v31
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:}

# 녹음 파일 업로드 한도. 기본값(1MB)으로는 녹음 파일을 받을 수 없다.
# Typecast의 복제 파일 한도(25MB)에 맞추고, 요청 전체는 다른 폼 값까지 고려해 조금 더 크게 둔다.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Worker: 이전 실행이 끝나고 1초 뒤에 다음 작업을 확인한다
dubbing.worker.fixed-delay-ms=1000
# 일시적인 오류(429, 5xx)는 이 횟수까지 시도한다
dubbing.worker.max-attempts=3
# PROCESSING 상태로 이 시간(분)이 지난 작업은 서버가 처리 중에 멈춘 것으로 보고 다시 가져온다
dubbing.worker.stale-after-minutes=5
# 결과 파일 다운로드 URL(presigned)의 유효 시간(분)
dubbing.audio-url-expiration-minutes=10

# ===== API 문서 (springdoc / Swagger UI) =====
# 로컬: http://localhost:8080/swagger-ui.html (JSON: /v3/api-docs)
# 개발용이므로 운영에서는 끈다: 환경변수 SPRINGDOC_API_DOCS_ENABLED=false, SPRINGDOC_SWAGGER_UI_ENABLED=false
# 메모 API는 제거할 예정이라 문서에서 뺀다
springdoc.paths-to-exclude=/memos/**,/tags/**
# 응답 형식을 */* 대신 실제 형식(JSON)으로 표시한다
springdoc.default-produces-media-type=application/json
# 공통 예외 처리기의 오류 응답 전체를 모든 API에 붙이지 않는다 (API마다 실제로 나오는 오류가 다르다)
springdoc.override-with-generic-response=false
