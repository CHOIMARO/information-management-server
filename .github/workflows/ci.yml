# CI 파이프라인.
# 트리거 설계 (실무 문법: "매 커밋은 검증, 태그는 릴리스"):
#   - PR:            테스트만 (머지 게이트 — 이미지는 만들지 않는다)
#   - main push:     테스트 + 이미지 빌드 → GHCR (latest, sha-<커밋> 태그) → 개발 서버(EC2) 배포 (deploy-dev job)
#   - v* 태그 push:  테스트 + 이미지 빌드 → GHCR (v1.2.3 버전 태그) = 릴리스 승격
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR(GitHub 컨테이너 레지스트리)에 이미지를 올리기 위한 권한

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # GitHub 러너에는 Docker가 기본 탑재 → Testcontainers가 PostgreSQL을 띄워 테스트한다.
      # 여기서 실패하면 이미지 빌드 단계로 넘어가지 않는다 = 테스트가 배포 게이트.
      - name: 테스트 및 빌드
        run: ./gradlew build

      # ---- 이하 이미지 빌드/푸시: PR에서는 건너뛴다 ----

      # 기본 docker 드라이버는 캐시 내보내기(type=gha)를 지원하지 않아 buildx 드라이버를 설정한다
      - name: Buildx 설정
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN은 Actions가 자동 발급하는 일회성 토큰 — 시크릿 등록이 따로 필요 없다
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 태그 계산
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main push → latest + sha-<커밋>, v* 태그 push → 그 버전 이름
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: 이미지 빌드 및 푸시
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 레이어 캐시를 Actions 캐시에 보관해 다음 빌드를 빠르게 한다
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 개발 서버(EC2) 자동 배포: main push에서만 ----
  # 방식: AWS SSM Run Command. GitHub가 EC2에 SSH로 접속하지 않고, AWS가 EC2 안의 SSM 에이전트에게 명령을 전달한다.
  #   - 보안 그룹의 SSH(22)를 GitHub 러너에 열지 않아도 된다 (지금 SSH는 회사·집 IP만 허용).
  #   - AWS 자격 증명은 OIDC로 받는다. GitHub가 이 실행에만 쓰는 토큰을 주고, AWS가 그 토큰을 믿고 역할을 빌려준다.
  #     오래 쓰는 액세스 키를 GitHub 시크릿에 저장하지 않는다.
  # 설정: docs/ec2-setup.md 7-1. 저장소 변수(AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID)가 없으면 이 job은 건너뛴다.
  deploy-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급 권한 (AWS 역할을 빌릴 때 쓴다)
    # 배포가 겹치지 않게 한 번에 하나씩 실행한다. 진행 중인 배포는 취소하지 않는다 (마이그레이션 도중 중단 방지).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      CONTAINER_NAME: magic-editor-server
      ENV_FILE: /home/ec2-user/magic-editor.env

    steps:
      - name: AWS 역할 빌리기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: EC2에 새 이미지 배포 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # latest가 아니라 이 커밋의 이미지(sha-<7자리>)를 배포한다. 어떤 커밋이 떠 있는지 정확히 알 수 있다.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "배포할 이미지: $IMAGE"

          # EC2 안에서 실행할 스크립트 (root로 실행된다)
          SCRIPT=$(cat <<SH
          set -eu
          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" || true
          docker run -d --name "$CONTAINER_NAME" --restart unless-stopped -p 80:8080 --env-file "$ENV_FILE" "$IMAGE"
          # 서버가 뜰 때까지 최대 3분 기다린다. 공개 API가 200을 주면 성공이다.
          for i in \$(seq 1 60); do
            if curl -fs -o /dev/null http://localhost/dubbing-options; then
              echo "배포 성공: $IMAGE"
              docker image prune -af > /dev/null
              exit 0
            fi
            sleep 3
          done
          echo "서버가 3분 안에 응답하지 않았다. 컨테이너 로그:"
          docker logs --tail 100 "$CONTAINER_NAME"
          exit 1
          SH
          )

          PARAMS=$(jq -n --arg script "$SCRIPT" '{commands: [$script], executionTimeout: ["600"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM 명령 id: $COMMAND_ID"

          # 명령이 끝날 때까지 10초 간격으로 최대 10분 확인한다
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "진행 중: $STATUS" ;;
              *) break ;;
            esac
          done

          # EC2에서 실행된 스크립트의 출력을 Actions 로그에 남긴다
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::배포 실패 (SSM 상태: $STATUS)"
            exit 1
          fi
